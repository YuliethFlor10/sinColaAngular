<div>
  <app-admin-web></app-admin-web>
  <app-contenido [title]="'Informe de servicios realizados'">
    
    <div class="container">
      <!-- Controles del reporte -->
      <div class="report-controls">
        <div class="date-range-selector">
          <div class="form-group">
            <label for="startDate">Fecha de inicio</label>
            <input 
              type="date" 
              id="startDate" 
              class="date-input"
              [(ngModel)]="startDate"
              (change)="onDateChange()">
          </div>
          <div class="form-group">
            <label for="endDate">Fecha de fin</label>
            <input 
              type="date" 
              id="endDate" 
              class="date-input"
              [(ngModel)]="endDate"
              (change)="onDateChange()">
          </div>
        </div>

        <div class="person-selector-report form-group">
          <label for="reportPersonSelect" class="person-label">Seleccione informe</label>
          <select 
            id="reportPersonSelect" 
            class="person-select"
            [(ngModel)]="selectedPerson"
            (change)="onPersonChange()">
            <option value="empresa">Empresa</option>
            <option value="yulieth">Yulieth</option>
            <option value="juanito">Juanito</option>
            <option value="pablito">Pablito</option>
          </select>
        </div>
        
        <button 
          class="btn-generate-report" 
          (click)="generateReport()"
          [disabled]="isGenerating">
          {{isGenerating ? 'Generando...' : 'Generar Informe'}}
        </button>
      </div>

      <!-- Resultados del reporte -->
      <div class="report-results">
        <div class="chart-container">
          <canvas 
            #servicesChart 
            id="servicesChart"
            *ngIf="showChart"></canvas>
          <p 
            class="no-data-message" 
            *ngIf="!showChart && !isGenerating">
            {{noDataMessage}}
          </p>
          <div 
            class="loading-spinner" 
            *ngIf="isGenerating">
            <div class="spinner"></div>
            <p>Generando informe...</p>
          </div>
        </div>

        <div class="summary-section">
          <div class="most-performed-services">
            <h3>Servicios más realizados</h3>
            <ul class="summary-list">
              <li *ngFor="let service of mostPerformedServices; let i = index">
                {{i + 1}}. {{service.name}} ({{service.count}} veces)
              </li>
              <li *ngIf="mostPerformedServices.length === 0">
                No hay datos para mostrar.
              </li>
            </ul>
          </div>
          
          <div class="total-value-obtained">
            <h3>Valor total obtenido</h3>
            <p class="summary-value">{{totalValue | currency:'COP':'symbol':'1.0-0'}}</p>
          </div>
        </div>
      </div>

      <!-- Mensajes de estado -->
      <div class="message-container">
        <div 
          class="success-message" 
          [class.show]="successMessage"
          *ngIf="successMessage">
          {{successMessage}}
        </div>
        
        <div 
          class="error-message-global" 
          [class.show]="errorMessage"
          *ngIf="errorMessage">
          {{errorMessage}}
        </div>
        
        <div 
          class="info-message-global" 
          [class.show]="infoMessage"
          *ngIf="infoMessage">
          {{infoMessage}}
        </div>
      </div>
    </div>
    
  </app-contenido>
</div>
