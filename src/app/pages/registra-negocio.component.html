<header class="header"
  style="background: linear-gradient(135deg,#fe57b8, #ee66fd, #4ec4ff, #59fde4 90%);
         color: white;
         padding: 1rem 1.5rem 0.5rem;
         display: flex;
         justify-content: space-between;
         align-items: flex-start;
         height: 80px;">
  <div style="flex: 1; display: flex; align-items: center;">
    <h1 class="titulo"
        style="font-size: 1.8rem; font-weight: bold; margin: 0 0 4px 0;">
      Bienvenido
    </h1>
  </div>
</header>
<main class="container" style="display:flex; justify-content:space-between; align-items:center; min-height:70vh;">
  <section style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <p style="font-size:1.2rem; text-align:center; margin-bottom:30px;">
      Agenda sin estrés. Porque el tiempo de tus clientes vale,<br>
      transforma la forma en que gestionas tus citas y<br>
      concéntrate en lo que realmente importa: atender a tus clientes mejor.
    </p>
    <img src="assets/iconos/logo.svg" alt="Logo SinCola" style="width:260px; margin-bottom:10px;" />
  </section>
  <section style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <div style="width:100%; max-width:400px;">
      <h2 style="text-align:center; font-size:2rem; font-weight:bold; margin-bottom:24px; background: linear-gradient(90deg,#fe57b8,#4ec4ff,#59fde4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Registra tu negocio</h2>
      <form style="display:flex; flex-direction:column; gap:18px;">
        <input type="text" placeholder="Nombre del establecimiento" required style="padding:12px 16px; border-radius:8px; border:1px solid #ccc; font-size:1rem;" />
        <input type="text" placeholder="Dirección del establecimiento" required style="padding:12px 16px; border-radius:8px; border:1px solid #ccc; font-size:1rem;" />
        <input type="text" placeholder="instagram del establecimiento" required style="padding:12px 16px; border-radius:8px; border:1px solid #ccc; font-size:1rem;" />
        <select required style="padding:12px 16px; border-radius:8px; border:1px solid #ccc; font-size:1rem;">
          <option value="">Tipo de negocio</option>
          <option value="salon">Salón de belleza</option>
          <option value="estetica">Centro de estética</option>
          <option value="odontologia">Clínica odontológica</option>
          <option value="barberia">Barbería</option>
        </select>
        <button type="submit" style="padding:12px 0; border-radius:8px; background:#000; color:#fff; font-weight:bold; font-size:1rem; border:none; margin-top:10px;">REGISTRARME</button>
      </form>
      <div style="display:flex; justify-content:center; gap:24px; margin-top:24px;">
        <img src="https://img.icons8.com/color/48/google-logo.png" alt="Google" style="width:32px; height:32px;" />
        <img src="https://img.icons8.com/ios-filled/50/000000/mac-os.png" alt="Apple" style="width:32px; height:32px;" />
        <img src="https://img.icons8.com/color/48/facebook-new.png" alt="Facebook" style="width:32px; height:32px;" />
      </div>
    </div>
  </section>
</main>
<footer>
  <p class="footer" style="text-align:center; margin-top:40px; background: linear-gradient(90deg,#fe57b8,#4ec4ff,#59fde4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size:1.1rem;">Tu tiempo es oro. No lo pongas en espera</p>
</footer>
