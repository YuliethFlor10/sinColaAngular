<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Token - SinCola</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fe57b8, #ee66fd, #4ec4ff, #59fde4 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #ff1493;
      margin-bottom: 10px;
      font-size: 2em;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95em;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s;
      margin-bottom: 20px;
    }

    input:focus {
      outline: none;
      border-color: #ff69b4;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 20, 147, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .resultado {
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      display: none;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success {
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
    }

    .error {
      background: #ffebee;
      border-left: 4px solid #f44336;
    }

    .resultado h3 {
      margin-bottom: 15px;
      font-size: 1.3em;
    }

    .success h3 {
      color: #2e7d32;
    }

    .error h3 {
      color: #c62828;
    }

    .info-grid {
      display: grid;
      gap: 8px;
      margin: 15px 0;
      font-size: 0.95em;
    }

    .info-item {
      display: flex;
      padding: 8px 0;
    }

    .info-label {
      font-weight: 600;
      color: #555;
      min-width: 100px;
    }

    .info-value {
      color: #333;
    }

    .url-box {
      background: white;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin: 15px 0;
      border: 1px solid #ddd;
      max-height: 150px;
      overflow-y: auto;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-secondary {
      background: linear-gradient(135deg, #2196F3, #1976D2);
      flex: 1;
    }

    .btn-success {
      background: linear-gradient(135deg, #4caf50, #388e3c);
      flex: 1;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .warning {
      background: #fff3e0;
      border-left: 4px solid #ff9800;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 0.9em;
      color: #e65100;
    }

    .warning strong {
      display: block;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🧪 Generador de Token</h1>
    <p class="subtitle">Herramienta de desarrollo para generar enlaces de confirmación de citas</p>

    <label for="citaId">ID de la Cita:</label>
    <input type="number" id="citaId" placeholder="Ejemplo: 1" value="1" min="1">

    <button onclick="generarToken()" id="btnGenerar">
      Generar Enlace de Confirmación
    </button>

    <div id="resultado" class="resultado"></div>

    <div class="warning">
      <strong>⚠️ Solo para desarrollo</strong>
      Este archivo debe eliminarse en producción. En el entorno real, los enlaces se envían automáticamente por email.
    </div>
  </div>

  <script>
    async function generarToken() {
      const citaId = document.getElementById('citaId').value;
      const resultado = document.getElementById('resultado');
      const btnGenerar = document.getElementById('btnGenerar');

      if (!citaId || citaId < 1) {
        mostrarError('Por favor ingresa un ID de cita válido');
        return;
      }

      // Mostrar loading
      btnGenerar.disabled = true;
      btnGenerar.innerHTML = '<span class="spinner"></span> Generando...';
      resultado.style.display = 'none';

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/citas/${citaId}/generar-token`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          }
        });

        const data = await response.json();

        if (data.success) {
          mostrarExito(data);
        } else {
          mostrarError(data.message || 'Error al generar el token');
        }
      } catch (error) {
        console.error('Error:', error);
        mostrarError('No se pudo conectar con el servidor. Verifica que Laravel esté ejecutándose en http://localhost:8000');
      } finally {
        btnGenerar.disabled = false;
        btnGenerar.innerHTML = 'Generar Enlace de Confirmación';
      }
    }

    function mostrarExito(data) {
      const resultado = document.getElementById('resultado');
      resultado.className = 'resultado success';
      resultado.innerHTML = `
                <h3>✅ Enlace generado exitosamente</h3>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Cliente:</span>
                        <span class="info-value">${data.cita.cliente}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Email:</span>
                        <span class="info-value">${data.cita.email}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Servicio:</span>
                        <span class="info-value">${data.cita.servicio}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Fecha:</span>
                        <span class="info-value">${data.cita.fecha} - ${data.cita.hora}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Estado:</span>
                        <span class="info-value">${data.cita.estado}</span>
                    </div>
                </div>

                <strong style="display: block; margin-top: 15px; color: #2e7d32;">URL de Confirmación:</strong>
                <div class="url-box">${data.url}</div>

                <div class="button-group">
                    <button class="btn-secondary" onclick="copiarEnlace('${data.url}')">
                        📋 Copiar Enlace
                    </button>
                    <button class="btn-success" onclick="abrirPagina('${data.url}')">
                        🚀 Abrir Página
                    </button>
                </div>
            `;
      resultado.style.display = 'block';
    }

    function mostrarError(mensaje) {
      const resultado = document.getElementById('resultado');
      resultado.className = 'resultado error';
      resultado.innerHTML = `
                <h3>❌ Error</h3>
                <p style="margin-top: 10px; color: #c62828;">${mensaje}</p>
            `;
      resultado.style.display = 'block';
    }

    function copiarEnlace(url) {
      navigator.clipboard.writeText(url)
        .then(() => {
          alert('✅ Enlace copiado al portapapeles');
        })
        .catch(() => {
          // Método alternativo para navegadores antiguos
          const textarea = document.createElement('textarea');
          textarea.value = url;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          alert('✅ Enlace copiado al portapapeles');
        });
    }

    function abrirPagina(url) {
      window.open(url, '_blank');
    }

    // Permitir generar con Enter
    document.getElementById('citaId').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        generarToken();
      }
    });
  </script>
</body>

</html>
